{% load static i18n %}
{% if mfa_login_timeout_active %}
<div
    id="mfa-login-countdown"
    class="alert alert-info text-center"
    role="status"
    aria-live="polite"
    data-remaining-seconds="{{ mfa_login_timeout_remaining_seconds }}"
>
    <i class="fa fa-clock-o" aria-hidden="true"></i>
    {% trans "Complete MFA within" %}
    <strong id="mfa-login-countdown-value">--:--</strong>.
    {% trans "When the timer reaches zero, you must enter your username and password again." %}
</div>

<form id="mfa-timeout-form" method="post" action="{% url 'mfa_cancel' %}" class="hidden" aria-hidden="true">
    {% csrf_token %}
    <input type="hidden" name="reason" value="timeout">
</form>

<script src="{% static 'javascripts/mfa-login-timeout.js' %}" defer></script>
{% endif %}
