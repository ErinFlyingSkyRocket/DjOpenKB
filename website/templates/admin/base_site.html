{% extends "admin/base_site.html" %}
{% load i18n language_choices %}

{% block extrastyle %}
{{ block.super }}
<style nonce="{{ csp_nonce }}">
  #content { max-width: none; }
  .change-list #content-main { overflow-x: auto; padding-bottom: 1rem; }
  .change-list #result_list { min-width: 1100px; }
  .change-list .actions,
  .change-list .paginator {
    position: sticky;
    left: 0;
    z-index: 2;
    background: var(--body-bg);
  }
  .djopenkb-admin-language {
    margin-top: 0.75rem;
    display: flex;
    gap: 0.4rem;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  .djopenkb-admin-language label { font-weight: 600; }
  .djopenkb-admin-language select { min-width: 150px; }
  .djopenkb-admin-guide { max-width: 920px; line-height: 1.5; }
  .djopenkb-admin-guide-wide { max-width: 980px; }
  .djopenkb-admin-guide-compact { max-width: 900px; }
  .djopenkb-admin-guide-table { border-collapse: collapse; margin-top: 8px; }
  .djopenkb-admin-guide-table-spaced { margin-bottom: 8px; }
  .djopenkb-admin-guide-help { margin-top: 8px; }
  .djopenkb-admin-guide-label {
    text-align: left;
    vertical-align: top;
    padding: 4px 12px 4px 0;
    white-space: nowrap;
  }
  .djopenkb-admin-guide-value { padding: 4px 0; }
  .djopenkb-role-guide-list { margin-left: 18px; }
  .djopenkb-mfa-status { font-weight: 600; }
  .djopenkb-mfa-status-configured { color: #0a7a2f; }
  .djopenkb-mfa-status-pending { color: #a15c00; }
  .djopenkb-mfa-status-not-configured { color: #8a1f11; }
  @media (max-width: 1024px) {
    .change-list #result_list { min-width: 980px; }
  }
</style>
{% endblock %}

{% block branding %}
{{ block.super }}
<form class="djopenkb-admin-language" action="{% url 'set_site_language' %}" method="post">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <label for="admin-language-select">{% trans "Language" %}</label>
  <select id="admin-language-select" name="language">
    {% get_current_language as CURRENT_LANGUAGE %}
    {% configured_language_choices as AVAILABLE_LANGUAGES %}
    {% for code, name in AVAILABLE_LANGUAGES %}
      <option value="{{ code }}"{% if code == CURRENT_LANGUAGE %} selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
  <button type="submit" class="button">{% trans "Apply" %}</button>
</form>
{% endblock %}

{% block extrahead %}
{{ block.super }}
<script nonce="{{ csp_nonce }}">
(function () {
  "use strict";

  var limits = {
    username: {{ input_limits.username }},
    email: {{ input_limits.email }},
    password: {{ input_limits.password }},
    password1: {{ input_limits.password }},
    password2: {{ input_limits.password }},
    old_password: {{ input_limits.password }},
    new_password1: {{ input_limits.password }},
    new_password2: {{ input_limits.password }},
    current_password: {{ input_limits.password }},
    code: {{ input_limits.mfa_code }},
    mfa_code: {{ input_limits.mfa_code }},
    q: {{ input_limits.search_query }},
    url: {{ input_limits.url }},
    review_notes: {{ input_limits.review_notes }},
    notes: {{ input_limits.profile_notes }},
    admin_allowed_cidrs: {{ input_limits.admin_allowed_cidrs }},
    target_user_lookup: {{ input_limits.user_lookup }}
  };
  var genericLimit = {{ input_limits.generic }};

  function applyLimit(element) {
    var name = element.getAttribute("name") || "";
    var configuredLimit = limits[name] || genericLimit;
    var currentLimit = parseInt(element.getAttribute("maxlength") || "0", 10);
    if (!currentLimit) {
      element.setAttribute("maxlength", String(configuredLimit));
    }
  }

  function applyAllLimits(root) {
    var scope = root || document;
    var selector = [
      'input[type="text"]',
      'input[type="search"]',
      'input[type="email"]',
      'input[type="password"]',
      'input[type="url"]',
      'textarea'
    ].join(",");
    scope.querySelectorAll(selector).forEach(applyLimit);
  }

  document.addEventListener("DOMContentLoaded", function () {
    applyAllLimits(document);

    if (window.MutationObserver) {
      new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          mutation.addedNodes.forEach(function (node) {
            if (!node || node.nodeType !== 1) {
              return;
            }
            if (node.matches && node.matches('input[type="text"], input[type="search"], input[type="email"], input[type="password"], input[type="url"], textarea')) {
              applyLimit(node);
            }
            applyAllLimits(node);
          });
        });
      }).observe(document.body, {childList: true, subtree: true});
    }
  });
}());
</script>
{% endblock %}
